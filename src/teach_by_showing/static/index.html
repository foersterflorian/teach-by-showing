<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kran-Demonstrator · teach-by-showing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="headline">Bringen Sie die Last ins Ziel – ohne dass sie pendelt</h1>
  <p id="hint">Linker Stick: Katze fahren</p>
</header>

<main>
  <canvas id="scene"></canvas>
  <!-- Below the scene: curves over time on the left, the style profile in
       the middle, the model on the right (DECISIONS.md §20, §22, §21). -->
  <div id="band" hidden>
    <canvas id="curves"></canvas>
    <div id="profile-panel" hidden>
      <p id="profile-title"></p>
      <table id="profile"></table>
      <p id="profile-note"></p>
    </div>
    <div id="model-panel" hidden>
      <canvas id="model"></canvas>
      <p id="formula"></p>
      <p id="explain"></p>
    </div>
  </div>
  <p id="banner" hidden></p>
  <p id="prompt" hidden></p>
  <p id="offline">Verbindung zum Kran wird hergestellt …</p>
</main>

<section id="readout">
  <div><span id="elapsed-label">Fahrzeit</span><b id="elapsed">0,0 s</b></div>
  <div id="ghost-readout" hidden><span id="ghost-label">Ihre Fahrt</span><b id="ghost-elapsed">0,0 s</b></div>
  <div><span id="command-label">Stellgröße</span><b><span id="command-bar"><i id="command-fill"></i></span></b></div>
  <div id="ghost-command-readout" hidden><span id="ghost-command-label">Stellgröße</span><b><span id="ghost-command-bar"><i id="ghost-command-fill"></i></span></b></div>
  <div><span>Transporte</span><b id="transports">0</b></div>
</section>

<!-- Filled in by the server, verbatim from funding.py (DECISIONS.md §2). -->
<footer id="funding"><!--FUNDING--></footer>

<script src="scene.js"></script>
<script src="curves.js"></script>
<script src="model.js"></script>
<script src="input.js"></script>
<script src="main.js"></script>
</body>
</html>
